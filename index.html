    <script>
      (function() {
        var areaMap = {restaurants:'public',restaurant:'public',cart:'public',checkout:'public',tracking:'public',search:'public',orders:'public',profile:'public',addresses:'public',session:'public',favorites:'public',notifications:'public',promotions:'public',support:'public',finance:'public',onboarding:'public',superadmin:'superadmin',admin:'admin',merchant:'merchant',courier:'access',experience:'access'};
        var prefix = location.pathname.split('/')[1] || '';
        var area = areaMap[prefix] || 'public';
        var saved = localStorage.getItem('fluxds-theme:' + area);
        if (saved === 'dark' || (saved === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
