<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iFood Clone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Nunito:wght@400;500;600;700;800&display=swap" />
    <script>
      (function() {
        var areaMap = {restaurants:'public',restaurant:'public',cart:'public',checkout:'public',tracking:'public',search:'public',orders:'public',profile:'public',addresses:'public',session:'public',favorites:'public',notifications:'public',promotions:'public',support:'public',finance:'public',onboarding:'public',superadmin:'superadmin',admin:'admin',merchant:'merchant',courier:'courier',access:'experience'};
        var prefix = location.pathname.split('/')[1] || '';
        var area = areaMap[prefix] || 'public';
        var saved = localStorage.getItem('fluxds-theme:' + area);
        if (saved === 'dark' || (saved === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
